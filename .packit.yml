# See the documentation for more information:
# https://packit.dev/docs/configuration/

specfile_path: python-pystemd.spec
files_to_sync:
  - python-pystemd.spec
  - .packit.yml

upstream_package_name: pystemd
downstream_package_name: python-pystemd
actions:
  get-current-version: "python3 setup.py --version"
  # Fetch the specfile from Rawhide, remove the snapshot and drop any patches
  post-upstream-clone: "bash -c \"curl -s https://src.fedoraproject.org/rpms/python-pystemd/raw/main/f/python-pystemd.spec | sed -e '/^Patch[0-9]/d' > python-pystemd.spec\""

srpm_build_deps:
  - bash
  - curl
  - systemd-devel
  - python3-setuptools
  - sed

jobs:
- job: copr_build
  trigger: commit
  owner: "@meta"
  project: pystemd
  targets:
    - fedora-all-aarch64
    - fedora-all-i386
    - fedora-all-ppc64le
    - fedora-all-s390x
    - fedora-all-x86_64
    - fedora-eln-aarch64
    - fedora-eln-i386
    - fedora-eln-ppc64le
    - fedora-eln-s390x
    - fedora-eln-x86_64
    # Replace with epel-all after EPEL 8 is EOL
    - epel-9-aarch64
    - epel-9-i386
    - epel-9-ppc64le
    - epel-9-s390x
    - epel-9-x86_64
    - epel-10-aarch64
    - epel-10-i386
    - epel-10-ppc64le
    - epel-10-s390x
    - epel-10-x86_64
- job: copr_build
  trigger: pull_request
  owner: "@meta"
  project: pystemd
  targets:
    - fedora-all-aarch64
    - fedora-all-i386
    - fedora-all-ppc64le
    - fedora-all-s390x
    - fedora-all-x86_64
    - fedora-eln-aarch64
    - fedora-eln-i386
    - fedora-eln-ppc64le
    - fedora-eln-s390x
    - fedora-eln-x86_64
    # Replace with epel-all after EPEL 8 is EOL
    - epel-9-aarch64
    - epel-9-i386
    - epel-9-ppc64le
    - epel-9-s390x
    - epel-9-x86_64
    - epel-10-aarch64
    - epel-10-i386
    - epel-10-ppc64le
    - epel-10-s390x
    - epel-10-x86_64
